version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: shopflow
      POSTGRES_PASSWORD: shopflow
      POSTGRES_DB: shopflow
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopflow"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - shopflow-net

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    networks:
      - shopflow-net

  auth:
    build: ./services/auth-service
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: "host=postgres user=shopflow password=shopflow dbname=shopflow port=5432 sslmode=disable"
      JWT_SECRET: "supersecret"
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shopflow-net

  product:
    build: ./services/product-service
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: "host=postgres user=shopflow password=shopflow dbname=shopflow port=5432 sslmode=disable"
      JWT_SECRET: "supersecret"
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shopflow-net

  order:
    build: ./services/order-service
    ports:
      - "8003:8003"
    environment:
      DATABASE_URL: "host=postgres user=shopflow password=shopflow dbname=shopflow port=5432 sslmode=disable"
      JWT_SECRET: "supersecret"
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shopflow-net

  payment:
    build: ./services/payment-service
    ports:
      - "8004:8004"
    environment:
      DATABASE_URL: "host=postgres user=shopflow password=shopflow dbname=shopflow port=5432 sslmode=disable"
      JWT_SECRET: "supersecret"
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shopflow-net

  notification:
    build: ./services/notification-service
    ports:
      - "8005:8005"
    restart: on-failure
    networks:
      - shopflow-net

  user-profile:
    build: ./services/user-profile
    ports:
      - "8006:8006"
    environment:
      DATABASE_URL: "host=postgres user=shopflow password=shopflow dbname=shopflow port=5432 sslmode=disable"
      JWT_SECRET: "supersecret"
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shopflow-net

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus:/etc/prometheus
    ports:
      - "9090:9090"
    restart: on-failure
    networks:
      - shopflow-net

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    restart: on-failure
    networks:
      - shopflow-net

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html
    ports:
      - "80:80"
    restart: on-failure
    depends_on:
      - auth
      - product
      - order
      - payment
      - notification
      - user-profile
    networks:
      - shopflow-net

networks:
  shopflow-net: