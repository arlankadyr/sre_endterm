events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream auth_upstream { server auth:8001; }
    upstream product_upstream { server product:8002; }
    upstream order_upstream { server order:8003; }
    upstream payment_upstream { server payment:8004; }
    upstream notification_upstream { server notification:8005; }
    upstream userprofile_upstream { server user-profile:8006; }

    server {
        listen 80;

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        location /auth/ {
            proxy_pass http://auth_upstream/;
            proxy_set_header Host $host;
        }
        location /products {
            proxy_pass http://product_upstream;
            proxy_set_header Host $host;
        }
        location /orders {
            proxy_pass http://order_upstream;
            proxy_set_header Host $host;
        }
        location /payments {
            proxy_pass http://payment_upstream;
            proxy_set_header Host $host;
        }
        location /notifications {
            proxy_pass http://notification_upstream;
            proxy_set_header Host $host;
        }
        location /profiles {
            proxy_pass http://userprofile_upstream;
            proxy_set_header Host $host;
        }
    }
}
