groups:
  - name: shopflow_alerts
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"

      - alert: HighErrorRate
        expr: slo:error_rate:rate5m > 0.01
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Error rate > 1% for {{ $labels.job }}"

      - alert: LowAvailability
        expr: slo:availability:rate5m < 0.99
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Availability below 99% for {{ $labels.job }}"

      - alert: HighLatency
        expr: slo:latency_p95:rate5m > 0.2
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "p95 latency > 200ms for {{ $labels.job }}"